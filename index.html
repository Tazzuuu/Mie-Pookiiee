<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Special Surprise ❤️</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#000;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
overflow:hidden;
color:white;
}

.box{
width:90%;
max-width:350px;
text-align:center;
background:#111;
padding:30px;
border-radius:20px;
box-shadow:0 0 25px #00ff88;
animation:glow 2s infinite alternate;
}

@keyframes glow{
from{box-shadow:0 0 15px #00ff88;}
to{box-shadow:0 0 35px #00ff88;}
}

h1{
margin-bottom:15px;
}

p{
color:#bbb;
margin-bottom:20px;
}

input{
width:100%;
padding:12px;
border:none;
outline:none;
border-radius:10px;
text-align:center;
font-size:18px;
margin-bottom:20px;
}

button{
padding:12px 25px;
border:none;
border-radius:10px;
background:#00ff88;
color:black;
font-weight:bold;
font-size:16px;
cursor:pointer;
}

button:hover{
background:white;
}
</style>
</head>
<body>

<div class="box">
<h1>🎁 A Special Surprise</h1>

<p>Only Mr. Pookie can unlock this gift ❤️</p>

<input type="password" id="pass" placeholder="Enter Password">

<button onclick="checkPass()">Unlock</button>

</div><script>

let p=document.getElementById("pass").value;

if(p=="2609"){

document.body.innerHTML=
<div style="background:black;height:100vh;color:#00ff88;display:flex;justify-content:center;align-items:center;font-family:monospace;font-size:22px;">
Loading...
</div>
;

}else{

alert("Wrong Password 😜");

}

}

</script>

</body>
</html>
